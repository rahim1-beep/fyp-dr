# Arm C2 — arm C with EFFECTIVE-NUMBER class weights instead of inverse frequency.
#
# Arm C used inverse frequency, which on this train split is a 36:1 ratio between grade 4
# and grade 0 (weights [0.061, 0.637, 0.299, 1.812, 2.191]). A grade-0 mistake therefore
# costs 1/36 of a grade-4 one, the decision boundary is displaced hard toward the rare
# classes, and 35.7% of grade-0 images came back as grade 1 (DECISION-034).
#
# Effective-number weighting (Cui et al. 2019, "Class-Balanced Loss Based on Effective
# Number of Samples") exists precisely because inverse frequency over-corrects: it weights
# by (1 - beta) / (1 - beta^n), which saturates as n grows rather than scaling as 1/n.
#
# WHY THIS ARM EXISTS. Without it, "class weighting does not work" is being claimed from a
# single experiment on the most aggressive weighting scheme available. The arm C paragraph
# in the write-up is only honest if the gentler scheme has actually been run.
imbalance:
  arm: C2
  sampler: none                 # weighting, not resampling - the same contrast as arm C
  loss: cross_entropy
  class_weights: true           # computed from TRAIN split counts only (R2)
  class_weight_scheme: effective_number
model:
  head: softmax
  num_outputs: 5
